<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<title>내 일정</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="top">
    <button class="ib" id="btn-menu" aria-label="설정 메뉴"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <button class="title-btn" id="btn-title" aria-label="연도·월 이동"><span id="title-text"></span><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16l-8 9z" fill="currentColor"/></svg></button>
    <div class="nav pc-only">
      <button class="ib" id="btn-prev" aria-label="이전"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button class="ib" id="btn-next" aria-label="다음"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
    <div class="spacer"></div>
    <button class="ib" id="btn-today" aria-label="오늘로"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><circle cx="12" cy="15" r="2" fill="currentColor" stroke="none"/></svg></button>
    <button class="ib" id="btn-view" aria-label="주간 보기"><svg id="ico-week" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4M3.5 14.5h17"/></svg><svg id="ico-month" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" style="display:none"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4M9.2 9.5v11M14.8 9.5v11M3.5 15h17"/></svg></button>
    <button class="ib" id="btn-add" aria-label="새로 만들기"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  </header>

  <div class="body">
    <main id="view" class="view"></main>
    <aside id="side" class="side"></aside>
  </div>

  <nav class="tabbar" aria-label="화면 이동">
    <button class="tab on" data-tab="calendar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>달력</button>
    <button class="tab" data-tab="work"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>업무</button>
    <button class="tab" data-tab="book"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3z"/><path d="M5 17a3 3 0 013-3h11"/></svg>미니북</button>
  </nav>
</div>

<!-- 왼쪽 메뉴 -->
<div class="scrim" id="drawer-scrim"></div>
<nav class="drawer" id="drawer" aria-label="메뉴">
  <div class="drawer-head">
    <div class="app-name">내 일정</div>
    <div class="app-sub" id="sync-state"></div>
  </div>
  <div class="drawer-group pc-nav">
    <button class="drawer-item" data-tab="calendar"><span class="di-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>달력</button>
    <button class="drawer-item" data-tab="work"><span class="di-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2"/></svg></span>업무</button>
    <button class="drawer-item" data-tab="book"><span class="di-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3z"/><path d="M5 17a3 3 0 013-3h11"/></svg></span>미니북</button>
  </div>
  <div class="drawer-label">설정</div>
  <div class="drawer-group">
    <button class="drawer-item" data-open="cats"><span class="di-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><circle cx="16.5" cy="16.5" r="3.5"/></svg></span>분류·색상 관리</button>
    <button class="drawer-item" data-open="theme"><span class="di-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>테마</button>
    <button class="drawer-item" data-open="rules"><span class="di-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 12a8 8 0 0114-5.3M20 12a8 8 0 01-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg></span>정기업무</button>
    <button class="drawer-item" data-open="attend"><span class="di-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span>근태 현황</button>
    <button class="drawer-item" data-open="io"><span class="di-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 4v12M3 12l4 4 4-4M17 20V8M13 12l4-4 4 4"/></svg></span>가져오기·내보내기</button>
    <button class="drawer-item" data-open="backup"><span class="di-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v3h16v-3"/></svg></span>백업</button>
    <button class="drawer-item" data-open="sync"><span class="di-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/></svg></span>동기화 코드</button>
  </div>
  <div class="drawer-foot" id="drawer-foot"></div>
</nav>

<!-- 모달 -->
<div class="modal-wrap" id="modal-wrap" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<div class="toast" id="toast" hidden></div>
<div class="update-bar" id="update-bar" hidden>새 버전이 있어요 <button id="btn-update">업데이트</button></div>

<script src="js/lunar-data.js"></script>
<script src="js/holidays.js"></script>
<script src="js/store.js"></script>
<script src="js/sync.js"></script>
<script src="js/lunar-years.js"></script>
<script src="js/ext.js"></script>
<script src="js/app.js"></script>
</body>
</html>
