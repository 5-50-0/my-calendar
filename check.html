<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 일정 · 저장된 데이터 확인</title>
<style>
  body { font-family: system-ui, "Malgun Gothic", sans-serif; background: #323230; color: #eee; margin: 0; padding: 20px; line-height: 1.55; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  .box { background: #3a3a38; border: 1px solid #555; border-radius: 12px; padding: 14px 16px; margin: 12px 0; }
  .k { font-family: ui-monospace, monospace; font-size: 13px; color: #bbb; }
  .n { font-size: 18px; font-weight: 700; margin: 4px 0; }
  .t { font-size: 13px; color: #ccc; }
  button { font: inherit; font-size: 14px; padding: 9px 14px; border-radius: 10px; border: 1px solid #777; background: #eee; color: #222; margin: 6px 6px 0 0; cursor: pointer; }
  .muted { color: #999; font-size: 13px; }
</style>
</head>
<body>
<h1>이 브라우저에 저장된 일정 데이터</h1>
<div class="muted">읽기만 하고 아무것도 바꾸지 않아요.</div>
<div id="out"></div>
<script>
(async function () {
  const out = document.getElementById('out');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const download = (name, text) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); };
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i));
  keys.sort();
  let html = '';
  keys.forEach((k, idx) => {
    const v = localStorage.getItem(k) || '';
    let info = `${v.length.toLocaleString()}자`;
    let detail = '';
    try {
      const d = JSON.parse(v);
      if (d && d.items) {
        const all = Object.values(d.items), live = all.filter(i => !i.deleted);
        const kinds = {}; live.forEach(i => { kinds[i.kind] = (kinds[i.kind] || 0) + 1; });
        info = `항목 ${live.length}개 (삭제 표시 ${all.length - live.length}개)`;
        detail = `<div class="t">${Object.entries(kinds).map(([a, b]) => `${esc(a)} ${b}`).join(' · ')}</div>`
          + `<div class="t">최근 수정: ${esc(live.map(i => i.updatedAt || '').sort().pop() || '-')}</div>`
          + `<div class="t">예: ${live.slice(0, 6).map(i => esc(i.title || i.topic || i.year || '')).join(' / ')}</div>`
          + (all.length - live.length ? `<div class="t" style="margin-top:8px">삭제 표시된 항목:<br>${all.filter(i => i.deleted).map(i => `· [${esc(i.kind)}] ${esc(i.title || i.topic || i.year || '(제목 없음)')} <span class="muted">${esc((i.updatedAt || '').slice(0, 16).replace('T', ' '))}</span>`).join('<br>')}</div>` : '')
          + `<button data-dl="${idx}">이 데이터 파일로 받기</button>`;
      }
    } catch (e) {}
    html += `<div class="box"><div class="k">${esc(k)}</div><div class="n">${info}</div>${detail}</div>`;
  });
  if (!keys.length) html = '<div class="box">저장된 데이터가 없어요.</div>';
  out.innerHTML = html;
  out.onclick = e => { const b = e.target.closest('[data-dl]'); if (!b) return; const k = keys[Number(b.dataset.dl)]; download(k + '.json', localStorage.getItem(k)); };
  // ---- 동기화 캐시(IndexedDB) 안에서 일정 꺼내기 ----
  const dec = v => {
    if (!v || typeof v !== 'object') return v;
    if ('stringValue' in v) return v.stringValue;
    if ('booleanValue' in v) return v.booleanValue;
    if ('integerValue' in v) return Number(v.integerValue);
    if ('doubleValue' in v) return v.doubleValue;
    if ('nullValue' in v) return null;
    if ('timestampValue' in v) return v.timestampValue;
    if ('arrayValue' in v) return ((v.arrayValue || {}).values || []).map(dec);
    if ('mapValue' in v) return decFields((v.mapValue || {}).fields || {});
    return undefined;
  };
  const decFields = f => { const o = {}; Object.keys(f || {}).forEach(k => { o[k] = dec(f[k]); }); return o; };
  const found = {};
  const walk = (x, depth) => {
    if (!x || typeof x !== 'object' || depth > 12) return;
    if (x.fields && typeof x.fields === 'object' && x.fields.kind && x.fields.id) {
      try { const it = decFields(x.fields); if (it.id && it.kind) { const c = found[it.id]; if (!c || (it.updatedAt || '') > (c.updatedAt || '')) found[it.id] = it; } } catch (e) {}
    }
    if (Array.isArray(x)) x.forEach(y => walk(y, depth + 1)); else Object.keys(x).forEach(k => walk(x[k], depth + 1));
  };
  const readDb = name => new Promise(res => {
    const rq = indexedDB.open(name);
    rq.onerror = () => res();
    rq.onupgradeneeded = () => { try { rq.transaction.abort(); } catch (e) {} res(); };
    rq.onsuccess = () => {
      const db = rq.result; const stores = Array.from(db.objectStoreNames);
      if (!stores.length) { db.close(); res(); return; }
      let left = stores.length;
      stores.forEach(st => {
        try {
          const cur = db.transaction(st, 'readonly').objectStore(st).openCursor();
          cur.onsuccess = () => { const c = cur.result; if (c) { walk(c.value, 0); c.continue(); } else if (--left === 0) { db.close(); res(); } };
          cur.onerror = () => { if (--left === 0) { db.close(); res(); } };
        } catch (e) { if (--left === 0) { db.close(); res(); } }
      });
    };
  });
  try {
    const names = indexedDB.databases ? (await indexedDB.databases()).map(d => d.name).filter(n => /firestore/.test(n)) : ['firestore/[DEFAULT]/my-calendar-6313d/main'];
    for (const n of names) await readDb(n);
    const all = Object.values(found), live = all.filter(i => !i.deleted);
    const kinds = {}; live.forEach(i => { kinds[i.kind] = (kinds[i.kind] || 0) + 1; });
    const ev = live.filter(i => i.kind === 'event' || i.kind === 'todo').sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    out.insertAdjacentHTML('beforeend', `<div class="box" style="border-color:#e0a070"><div class="k">동기화 캐시 안에서 찾은 항목</div><div class="n">항목 ${live.length}개 (삭제 표시 ${all.length - live.length}개)</div>`
      + `<div class="t">${Object.entries(kinds).map(([a, b]) => `${esc(a)} ${b}`).join(' · ') || '없음'}</div>`
      + (ev.length ? `<div class="t" style="margin-top:8px">일정·할 일 ${ev.length}개:<br>${ev.slice(0, 300).map(i => `· ${esc(i.date || '')} ${esc(i.title || '')}`).join('<br>')}</div>` : '')
      + (all.length ? `<button id="dl-cache">찾은 항목 전부 백업 파일로 받기</button>` : '') + `</div>`);
    const b = document.getElementById('dl-cache');
    if (b) b.onclick = () => {
      const items = {}; all.forEach(i => { items[i.id] = i; });
      download('내일정-캐시에서-꺼낸-백업.json', JSON.stringify({ schema: 1, items, weekMemos: {}, settings: null, savedAt: new Date().toISOString() }, null, 2));
    };
  } catch (e) { out.insertAdjacentHTML('beforeend', `<div class="box">캐시를 읽지 못했어요: ${esc(e.message)}</div>`); }

  // Firestore가 기기에 남긴 캐시 목록
  try {
    if (indexedDB.databases) {
      const dbs = await indexedDB.databases();
      out.insertAdjacentHTML('beforeend', `<div class="box"><div class="k">기기 캐시</div><div class="t">${dbs.map(d => esc(d.name)).join('<br>') || '없음'}</div></div>`);
    }
  } catch (e) {}
})();
</script>
</body>
</html>
